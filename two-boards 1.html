  starPoints(n).forEach(([r,c])=>{
    const x=M+c*L, y=M+r*L;
    hoshi += `<circle cx="${x}" cy="${y}" r="${n>=19?3:3.5}" fill="#5a4a30"></circle>`;
  });
  const stoneR = n >= 19 ? 12.5 : 20;
  let stones='', interactive='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const x=M+c*L, y=M+r*L;
    if(!pg.gameOver) interactive += `<rect x="${x-L/2}" y="${y-L/2}" width="${L}" height="${L}" fill="transparent" style="cursor:pointer" data-action="play-go-point" data-r="${r}" data-c="${c}"></rect>`;
    const occ = board[r][c];
    if(occ==='black') stones += `<circle cx="${x}" cy="${y}" r="${stoneR}" fill="#1C1A17" stroke="#000" stroke-width="0.5"></circle>`;
    else if(occ==='white') stones += `<circle cx="${x}" cy="${y}" r="${stoneR}" fill="#F5F1E8" stroke="#8a8071" stroke-width="1"></circle>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <rect x="0" y="0" width="${size}" height="${size}" fill="var(--board-wood)"></rect>
    ${lines}${hoshi}${stones}${interactive}
  </svg>`;
}

function chessStatusLine(pc){
  if(pc.thinking) return `<span class="thinking">The AI is thinking…</span>`;
  if(pc.status.over){
    if(pc.status.result==='stalemate') return 'Stalemate — the game is a draw.';
    if(pc.status.result==='w-wins-checkmate') return 'Checkmate — you win!';
    if(pc.status.result==='b-wins-checkmate') return 'Checkmate — the AI wins.';
  }
  if(inCheck(pc.gs.board, pc.gs.turn)) return pc.gs.turn==='w' ? 'You are in check!' : 'The AI is in check.';
  return pc.gs.turn==='w' ? 'Your move (White).' : "AI's move (Black).";
}

function renderPlayChess(){
  if(!state.play.chess) initPlayChess();
  const pc = state.play.chess;
  return `
  <div class="play-controls">
    <div class="diff-group">
      <button class="diff-btn ${state.play.chessDifficulty==='easy'?'active':''}" data-action="play-set-diff" data-diff="easy">Easy</button>
      <button class="diff-btn ${state.play.chessDifficulty==='normal'?'active':''}" data-action="play-set-diff" data-diff="normal">Normal</button>
      <button class="diff-btn ${state.play.chessDifficulty==='hard'?'active':''}" data-action="play-set-diff" data-diff="hard">Hard</button>
    </div>
    <button class="action-btn" data-action="play-chess-new">New game</button>
  </div>
  <p style="max-width:52ch;">You play White, the AI plays Black. Pawns promote automatically to a queen.</p>
  <div class="status-line">${chessStatusLine(pc)}</div>
  <div class="board-holder">${renderPlayChessBoardSVG()}</div>`;
}

function goStatusLine(pg){
  if(pg.gameOver) return 'Game over — see the score below.';
  if(pg.thinking) return `<span class="thinking">The AI is thinking…</span>`;
  return pg.turn==='black' ? 'Your move (Black).' : "AI's move (White).";
}

function renderPlayGo(){
  if(!state.play.go) initPlayGo();
  const pg = state.play.go;
  const scoreBlock = pg.gameOver && pg.scores ? `
    <div class="game-over-banner">
      <h3>${pg.scores.black > pg.scores.white ? 'You win!' : 'The AI wins.'}</h3>
      <div class="score-row">
        <span>Black (you): ${pg.scores.black}</span>
        <span>White (AI): ${pg.scores.white} <span style="opacity:0.7">(incl. ${pg.scores.komi} komi)</span></span>
      </div>
    </div>` : '';
  return `
  <div class="play-controls">
    <button class="action-btn" data-action="play-go-new">New game</button>
    <button class="action-btn" data-action="play-go-pass" ${pg.gameOver || pg.turn!=='black' || pg.thinking ? 'disabled':''}>Pass</button>
  </div>
  <p style="max-width:52ch;">You play Black and move first, the AI plays White. 19×19 board, area scoring with 7.5 komi — two passes in a row ends the game.</p>
  <div class="status-line">${goStatusLine(pg)}</div>
  ${pg.message ? `<div class="message-box show">${pg.message}</div>` : ''}
  <div class="board-holder" style="margin-top:14px;">${renderPlayGoBoardSVG()}</div>
  ${scoreBlock}`;
}

function renderPlaySection(){
  const game = state.play.game;
  return `
  <h2>Play vs AI</h2>
  <div class="game-tabs">
    <button class="game-tab ${game==='chess'?'active':''}" data-game="chess" data-action="play-select-game" data-idx="chess">Chess</button>
    <button class="game-tab ${game==='go'?'active':''}" data-game="go" data-action="play-select-game" data-idx="go">Go</button>
  </div>
  ${game==='chess' ? renderPlayChess() : renderPlayGo()}`;
}

function renderPuzzleSidebar(list, activeIdx, selectAction){
  return list.map((p,i)=>`
    <button class="lesson-item ${i===activeIdx?'active':''}" data-action="${selectAction}" data-idx="${i}">
      <span class="num">${i+1}</span><span>${p.title}</span>
    </button>`).join('');
}

function renderPuzzleChess(){
  if(!state.puzzles.chessAttempt) initPuzzleChess(0);
  const idx = state.puzzles.chessIndex;
  const puzzle = CHESS_PUZZLES[idx];
  const pz = state.puzzles.chessAttempt;
  let legalTargets = [];
  if(pz.selected && !pz.solved){
    legalTargets = generateLegalMoves(pz.gs).filter(m => m.from[0]===pz.selected[0] && m.from[1]===pz.selected[1]);
  }
  const banner = pz.message ? `<div class="message-box show ${pz.solved ? 'puzzle-success' : 'puzzle-fail'}">${pz.message}</div>` : '';
  return `
  <div class="lesson-wrap">
    <div class="sidebar">
      <div class="sidebar-title">Chess puzzles</div>
      ${renderPuzzleSidebar(CHESS_PUZZLES, idx, 'puzzle-chess-select')}
    </div>
    <div class="content">
      <div class="kicker" style="color:var(--chess)">Puzzle ${idx+1} of ${CHESS_PUZZLES.length}</div>
      <h2>${puzzle.title}</h2>
      <p>${puzzle.intro}</p>
      <div class="board-area">
        <div class="board-holder">${renderChessFullBoardSVG(pz.gs, pz.selected, legalTargets, 'puzzle-chess-square', !pz.solved)}</div>
        <div class="side-note">
          ${banner}
          <button class="reset-btn" data-action="puzzle-chess-reset">Reset this puzzle</button>
        </div>
      </div>
      <div class="lesson-nav">
        <button data-action="puzzle-chess-prev" ${idx===0?'disabled':''}>← Previous</button>
        <button data-action="puzzle-chess-next" ${idx===CHESS_PUZZLES.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
  </div>`;
}

function renderPuzzleGo(){
  if(!state.puzzles.goAttempt) initPuzzleGo(0);
  const idx = state.puzzles.goIndex;
  const puzzle = GO_PUZZLES[idx];
  const pz = state.puzzles.goAttempt;
  const banner = pz.message ? `<div class="message-box show ${pz.solved ? 'puzzle-success' : 'puzzle-fail'}">${pz.message}</div>` : '';
  return `
  <div class="lesson-wrap">
    <div class="sidebar">
      <div class="sidebar-title">Go puzzles</div>
      ${renderPuzzleSidebar(GO_PUZZLES, idx, 'puzzle-go-select')}
    </div>
    <div class="content">
      <div class="kicker" style="color:var(--go)">Puzzle ${idx+1} of ${GO_PUZZLES.length}</div>
      <h2>${puzzle.title}</h2>
      <p>${puzzle.intro}</p>
      <div class="board-area">
        <div class="board-holder">${renderPuzzleGoBoardSVG(pz.board, !pz.solved)}</div>
        <div class="side-note">
          ${banner}
          <button class="reset-btn" data-action="puzzle-go-reset">Reset this puzzle</button>
        </div>
      </div>
      <div class="lesson-nav">
        <button data-action="puzzle-go-prev" ${idx===0?'disabled':''}>← Previous</button>
        <button data-action="puzzle-go-next" ${idx===GO_PUZZLES.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
  </div>`;
}

function renderPuzzlesSection(){
  const game = state.puzzles.game;
  return `
  <h2>Puzzles</h2>
  <div class="game-tabs">
    <button class="game-tab ${game==='chess'?'active':''}" data-game="chess" data-action="puzzles-select-game" data-idx="chess">Chess</button>
    <button class="game-tab ${game==='go'?'active':''}" data-game="go" data-action="puzzles-select-game" data-idx="go">Go</button>
  </div>
  ${game==='chess' ? renderPuzzleChess() : renderPuzzleGo()}`;
}


/* ============================================================
   EVENTS
============================================================ */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action === 'play-select-game'){
    state.play.game = el.dataset.idx;
    render();
  } else if(action === 'puzzles-select-game'){
    state.puzzles.game = el.dataset.idx;
    render();
  } else if(action === 'puzzle-chess-select'){
    initPuzzleChess(parseInt(el.dataset.idx,10));
    render();
  } else if(action === 'puzzle-chess-prev'){
    if(state.puzzles.chessIndex > 0) initPuzzleChess(state.puzzles.chessIndex - 1);
    render();
  } else if(action === 'puzzle-chess-next'){
    if(state.puzzles.chessIndex < CHESS_PUZZLES.length - 1) initPuzzleChess(state.puzzles.chessIndex + 1);
    render();
  } else if(action === 'puzzle-chess-reset'){
    initPuzzleChess(state.puzzles.chessIndex);
    render();
  } else if(action === 'puzzle-chess-square'){
    puzzleChessSquareClick(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'puzzle-go-select'){
    initPuzzleGo(parseInt(el.dataset.idx,10));
    render();
  } else if(action === 'puzzle-go-prev'){
    if(state.puzzles.goIndex > 0) initPuzzleGo(state.puzzles.goIndex - 1);
    render();
  } else if(action === 'puzzle-go-next'){
    if(state.puzzles.goIndex < GO_PUZZLES.length - 1) initPuzzleGo(state.puzzles.goIndex + 1);
    render();
  } else if(action === 'puzzle-go-reset'){
    initPuzzleGo(state.puzzles.goIndex);
    render();
  } else if(action === 'puzzle-go-point'){
    puzzleGoPointClick(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'play-set-diff'){
    state.play.chessDifficulty = el.dataset.diff;
    render();
  } else if(action === 'play-chess-new'){
    initPlayChess();
    render();
  } else if(action === 'play-chess-square'){
    playChessSquareClick(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'play-go-new'){
    initPlayGo();
    render();
  } else if(action === 'play-go-point'){
    playGoPointClick(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'play-go-pass'){
    playGoPass();
  } else if(action === 'nav'){
    state.section = el.dataset.target;
    render();
  } else if(action === 'chess-select'){
    initChessLesson(parseInt(el.dataset.idx,10));
    render();
  } else if(action === 'chess-prev'){
    if(state.chess.lessonIdx > 0) initChessLesson(state.chess.lessonIdx - 1);
    render();
  } else if(action === 'chess-next'){
    if(state.chess.lessonIdx < CHESS_LESSONS.length - 1) initChessLesson(state.chess.lessonIdx + 1);
    render();
  } else if(action === 'chess-reset'){
    initChessLesson(state.chess.lessonIdx);
    render();
  } else if(action === 'chess-square'){
    handleChessSquare(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'chess-opening-square'){
    chessOpeningSquareClick(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'chess-opening-reset'){
    state.chess.opening = { gs: initialChessGS(), selected: null, played: null };
    render();
  } else if(action === 'chess-theory-select'){
    chessTheorySelect(parseInt(el.dataset.idx,10));
  } else if(action === 'chess-theory-next'){
    chessTheoryNext();
  } else if(action === 'chess-theory-prev'){
    chessTheoryPrev();
  } else if(action === 'chess-theory-reset'){
    chessTheoryReset();
  } else if(action === 'chess-theory-back'){
    chessTheoryBack();
  } else if(action === 'go-ladder-next'){
    goLadderNext();
  } else if(action === 'go-ladder-prev'){
    goLadderPrev();
  } else if(action === 'go-ladder-reset'){
    goLadderReset();
  } else if(action === 'go-joseki-next'){
    goJosekiNext();
  } else if(action === 'go-joseki-prev'){
    goJosekiPrev();
  } else if(action === 'go-joseki-reset'){
    goJosekiReset();
  } else if(action === 'go-joseki-select'){
    goJosekiSelect(parseInt(el.dataset.idx,10));
  } else if(action === 'go-joseki-back'){
    goJosekiBack();
  } else if(action === 'go-select'){
    initGoLesson(parseInt(el.dataset.idx,10));
    render();
  } else if(action === 'go-prev'){
    if(state.go.lessonIdx > 0) initGoLesson(state.go.lessonIdx - 1);
    render();
  } else if(action === 'go-next'){
    if(state.go.lessonIdx < GO_LESSONS.length - 1) initGoLesson(state.go.lessonIdx + 1);
    render();
  } else if(action === 'go-reset'){
    initGoLesson(state.go.lessonIdx);
    render();
  } else if(action === 'go-point'){
    placeGoStone(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  }
});

render();
</script>
