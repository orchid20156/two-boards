function renderGoSection(){
  if(!state.go.initialized){ initGoLesson(0); state.go.initialized = true; }
  const idx = state.go.lessonIdx;
  const lesson = GO_LESSONS[idx];

  const sidebarItems = GO_LESSONS.map((l,i)=>`
    <button class="lesson-item ${i===idx?'active':''}" data-action="go-select" data-idx="${i}">
      <span class="num">${i+1}</span><span>${l.title}</span>
    </button>`).join('');

  let body;
  if(lesson.type === 'joseki'){
    const js_ = state.go.joseki;
    if(js_.patternIdx === null){
      body = `<div class="opening-picker">${JOSEKI_LIBRARY.map((p,i)=>`
        <button class="opening-pick" data-action="go-joseki-select" data-idx="${i}">
          <span class="opening-pick-name">${p.name}</span>
          <span class="opening-pick-blurb">${p.blurb}</span>
        </button>`).join('')}</div>`;
    } else {
      const pattern = JOSEKI_LIBRARY[js_.patternIdx];
      const board = js_.history[js_.stepIndex];
      const atStart = js_.stepIndex === 0;
      const atEnd = js_.stepIndex >= pattern.moves.length;
      const caption = atStart ? 'Empty corner — press "Next move" to begin.' : pattern.moves[js_.stepIndex-1].caption;
      const lastMove = atStart ? null : [pattern.moves[js_.stepIndex-1].r, pattern.moves[js_.stepIndex-1].c];
      body = `
        <div class="board-area">
          <div class="board-holder">${renderStaticGoBoardSVG(board, lastMove)}</div>
          <div class="side-note">
            <div class="kicker" style="color:var(--go); margin-bottom:6px;">${pattern.name} · move ${js_.stepIndex} of ${pattern.moves.length}</div>
            <div class="message-box show">${caption}</div>
            <div class="play-controls" style="margin-top:14px;">
              <button class="action-btn" data-action="go-joseki-prev" ${atStart?'disabled':''}>← Back</button>
              <button class="action-btn" data-action="go-joseki-next" ${atEnd?'disabled':''}>Next move →</button>
            </div>
            <button class="reset-btn" data-action="go-joseki-reset">Restart this sequence</button>
            <button class="reset-btn" data-action="go-joseki-back" style="margin-left:16px;">Choose a different pattern</button>
          </div>
        </div>`;
    }
  } else {
    body = `
      <div class="board-area">
        <div class="board-holder">${renderGoBoardSVG()}</div>
        <div class="side-note">
          <div class="turn-indicator"><span class="turn-dot ${state.go.turn}"></span>${state.go.turn === 'black' ? 'Black' : 'White'} to play</div>
          <div class="legend">
            <span><span class="legend-dot" style="background:var(--gold)"></span>liberty</span>
          </div>
          <div class="hint">${lesson.hint}</div>
          <div class="message-box ${state.go.message ? 'show':''}">${state.go.message}</div>
          <button class="reset-btn" data-action="go-reset">Reset this lesson</button>
        </div>
      </div>`;
  }

  return `
  <div class="lesson-wrap">
    <div class="sidebar">
      <div class="sidebar-title">Go lessons</div>
      ${sidebarItems}
    </div>
    <div class="content">
      <div class="kicker" style="color:var(--go)">Go · Lesson ${idx+1} of ${GO_LESSONS.length}</div>
      <h2>${lesson.title}</h2>
      <p>${lesson.intro}</p>
      ${body}
      <div class="lesson-nav">
        <button data-action="go-prev" ${idx===0?'disabled':''}>← Previous</button>
        <button data-action="go-next" ${idx===GO_LESSONS.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
  </div>`;
}

function renderChessFullBoardSVG(gs, selected, legalTargets, actionName, interactive, popularTargets){
  const board = gs.board;
  const S = 56, M = 24;
  if(interactive === undefined) interactive = true;
  popularTargets = popularTargets || [];
  const isTarget = (r,c) => legalTargets.some(m=>m.to[0]===r&&m.to[1]===c);
  const isTargetCapture = (r,c) => isTarget(r,c) && (board[r][c] || legalTargets.some(m=>m.to[0]===r&&m.to[1]===c&&m.isEnPassant));

  let squares = '';
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const x = M+c*S, y = M+r*S;
    const dark = (r+c)%2===1;
    let fill = dark ? 'var(--dark-square)' : 'var(--light-square)';
    squares += `<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="${fill}"></rect>`;
    if(selected && selected[0]===r && selected[1]===c){
      squares += `<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="var(--gold)" opacity="0.35"></rect>`;
    }
  }
  let markers = '', interactiveRects = '';
  legalTargets.forEach(m=>{
    const [r,c] = m.to;
    const x = M+c*S+S/2, y = M+r*S+S/2;
    if(isTargetCapture(r,c)){
      markers += `<circle cx="${x}" cy="${y}" r="24" fill="none" stroke="var(--chess)" stroke-width="4" opacity="0.85"></circle>`;
    } else {
      markers += `<circle cx="${x}" cy="${y}" r="8" fill="var(--gold)" opacity="0.85"></circle>`;
      if(popularTargets.some(p=>p[0]===r&&p[1]===c)){
        markers += `<circle cx="${x}" cy="${y}" r="16" fill="none" stroke="var(--gold)" stroke-width="2"></circle>`;
      }
    }
  });
  if(interactive){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      interactiveRects += `<rect x="${M+c*S}" y="${M+r*S}" width="${S}" height="${S}" fill="transparent" style="cursor:pointer" data-action="${actionName}" data-r="${r}" data-c="${c}"></rect>`;
    }
  }
  let pieces = '';
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p) continue;
    const x = M+c*S+S/2, y = M+r*S+S/2+14;
    const glyph = PIECE_GLYPHS[p.c][p.t];
    if(p.c==='w') pieces += `<text x="${x}" y="${y}" font-size="38" text-anchor="middle" fill="#F5F1E8" stroke="#5E2727" stroke-width="1">${glyph}</text>`;
    else pieces += `<text x="${x}" y="${y}" font-size="38" text-anchor="middle" fill="#241f1a">${glyph}</text>`;
  }
  let files='', ranks='';
  for(let c=0;c<8;c++) files += `<text x="${M+c*S+S/2}" y="${M+8*S+16}" font-size="12" text-anchor="middle" fill="var(--text-soft)">${String.fromCharCode(97+c)}</text>`;
  for(let r=0;r<8;r++) ranks += `<text x="${M-10}" y="${M+r*S+S/2+4}" font-size="12" text-anchor="middle" fill="var(--text-soft)">${8-r}</text>`;
  const size = M*2+8*S;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${squares}${markers}${pieces}${files}${ranks}${interactiveRects}</svg>`;
}

function renderPlayChessBoardSVG(){
  const pc = state.play.chess;
  let legalTargets = [];
  if(pc.selected && pc.gs.turn==='w' && !pc.thinking){
    legalTargets = generateLegalMoves(pc.gs).filter(m => m.from[0]===pc.selected[0] && m.from[1]===pc.selected[1]);
  }
  return renderChessFullBoardSVG(pc.gs, pc.selected, legalTargets, 'play-chess-square', true);
}

function renderPlayGoBoardSVG(){
  const pg = state.play.go;
  const board = pg.board;
  const n = board.length;
  const L = n >= 19 ? 27 : 48, M = n >= 19 ? 22 : 32;
  const size = M*2+(n-1)*L;
  let lines='';
  for(let i=0;i<n;i++){
    const pos = M+i*L;
    lines += `<line x1="${M}" y1="${pos}" x2="${M+(n-1)*L}" y2="${pos}" stroke="#5a4a30" stroke-width="1"></line>`;
    lines += `<line x1="${pos}" y1="${M}" x2="${pos}" y2="${M+(n-1)*L}" stroke="#5a4a30" stroke-width="1"></line>`;
  }
  let hoshi='';
  starPoints(n).forEach(([r,c])=>{
    const x=M+c*L, y=M+r*L;
    hoshi += `<circle cx="${x}" cy="${y}" r="${n>=19?3:3.5}" fill="#5a4a30"></circle>`;
  });
  const stoneR = n >= 19 ? 12.5 : 20;
  let stones='', interactive='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const x=M+c*L, y=M+r*L;
    if(!pg.gameOver) interactive += `<rect x="${x-L/2}" y="${y-L/2}" width="${L}" height="${L}" fill="transparent" style="cursor:pointer" data-action="play-go-point" data-r="${r}" data-c="${c}"></rect>`;
    const occ = board[r][c];
    if(occ==='black') stones += `<circle cx="${x}" cy="${y}" r="${stoneR}" fill="#1C1A17" stroke="#000" stroke-width="0.5"></circle>`;
    else if(occ==='white') stones += `<circle cx="${x}" cy="${y}" r="${stoneR}" fill="#F5F1E8" stroke="#8a8071" stroke-width="1"></circle>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <rect x="0" y="0" width="${size}" height="${size}" fill="var(--board-wood)"></rect>
    ${lines}${hoshi}${stones}${interactive}
  </svg>`;
}

function chessStatusLine(pc){
  if(pc.thinking) return `<span class="thinking">The AI is thinking…</span>`;
  if(pc.status.over){
    if(pc.status.result==='stalemate') return 'Stalemate — the game is a draw.';
    if(pc.status.result==='w-wins-checkmate') return 'Checkmate — you win!';
    if(pc.status.result==='b-wins-checkmate') return 'Checkmate — the AI wins.';
  }
  if(inCheck(pc.gs.board, pc.gs.turn)) return pc.gs.turn==='w' ? 'You are in check!' : 'The AI is in check.';
  return pc.gs.turn==='w' ? 'Your move (White).' : "AI's move (Black).";
}

function renderPlayChess(){
  if(!state.play.chess) initPlayChess();
  const pc = state.play.chess;
  return `
  <div class="play-controls">
    <div class="diff-group">
      <button class="diff-btn ${state.play.chessDifficulty==='easy'?'active':''}" data-action="play-set-diff" data-diff="easy">Easy</button>
      <button class="diff-btn ${state.play.chessDifficulty==='normal'?'active':''}" data-action="play-set-diff" data-diff="normal">Normal</button>
      <button class="diff-btn ${state.play.chessDifficulty==='hard'?'active':''}" data-action="play-set-diff" data-diff="hard">Hard</button>
    </div>
    <button class="action-btn" data-action="play-chess-new">New game</button>
  </div>
  <p style="max-width:52ch;">You play White, the AI plays Black. Pawns promote automatically to a queen.</p>
  <div class="status-line">${chessStatusLine(pc)}</div>
  <div class="board-holder">${renderPlayChessBoardSVG()}</div>`;
}

function goStatusLine(pg){
  if(pg.gameOver) return 'Game over — see the score below.';
  if(pg.thinking) return `<span class="thinking">The AI is thinking…</span>`;
  return pg.turn==='black' ? 'Your move (Black).' : "AI's move (White).";
}

function renderPlayGo(){
  if(!state.play.go) initPlayGo();
  const pg = state.play.go;
  const scoreBlock = pg.gameOver && pg.scores ? `
    <div class="game-over-banner">
      <h3>${pg.scores.black > pg.scores.white ? 'You win!' : 'The AI wins.'}</h3>
      <div class="score-row">
        <span>Black (you): ${pg.scores.black}</span>
        <span>White (AI): ${pg.scores.white} <span style="opacity:0.7">(incl. ${pg.scores.komi} komi)</span></span>
      </div>
    </div>` : '';
  return `
  <div class="play-controls">
    <button class="action-btn" data-action="play-go-new">New game</button>
    <button class="action-btn" data-action="play-go-pass" ${pg.gameOver || pg.turn!=='black' || pg.thinking ? 'disabled':''}>Pass</button>
  </div>
  <p style="max-width:52ch;">You play Black and move first, the AI plays White. 19×19 board, area scoring with 7.5 komi — two passes in a row ends the game.</p>
  <div class="status-line">${goStatusLine(pg)}</div>
  ${pg.message ? `<div class="message-box show">${pg.message}</div>` : ''}
  <div class="board-holder" style="margin-top:14px;">${renderPlayGoBoardSVG()}</div>
  ${scoreBlock}`;
}

function renderPlaySection(){
  const game = state.play.game;
  return `
  <h2>Play vs AI</h2>
  <div class="game-tabs">
    <button class="game-tab ${game==='chess'?'active':''}" data-game="chess" data-action="play-select-game" data-idx="chess">Chess</button>
    <button class="game-tab ${game==='go'?'active':''}" data-game="go" data-action="play-select-game" data-idx="go">Go</button>
  </div>
  ${game==='chess' ? renderPlayChess() : renderPlayGo()}`;
}


/* ============================================================
   EVENTS
============================================================ */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action === 'play-select-game'){
    state.play.game = el.dataset.idx;
    render();
  } else if(action === 'play-set-diff'){
    state.play.chessDifficulty = el.dataset.diff;
    render();
  } else if(action === 'play-chess-new'){
    initPlayChess();
    render();
  } else if(action === 'play-chess-square'){
    playChessSquareClick(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'play-go-new'){
    initPlayGo();
    render();
  } else if(action === 'play-go-point'){
    playGoPointClick(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'play-go-pass'){
    playGoPass();
  } else if(action === 'nav'){
    state.section = el.dataset.target;
    render();
  } else if(action === 'chess-select'){
    initChessLesson(parseInt(el.dataset.idx,10));
    render();
  } else if(action === 'chess-prev'){
    if(state.chess.lessonIdx > 0) initChessLesson(state.chess.lessonIdx - 1);
    render();
  } else if(action === 'chess-next'){
    if(state.chess.lessonIdx < CHESS_LESSONS.length - 1) initChessLesson(state.chess.lessonIdx + 1);
    render();
  } else if(action === 'chess-reset'){
    initChessLesson(state.chess.lessonIdx);
    render();
  } else if(action === 'chess-square'){
    handleChessSquare(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'chess-opening-square'){
    chessOpeningSquareClick(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  } else if(action === 'chess-opening-reset'){
    state.chess.opening = { gs: initialChessGS(), selected: null, played: null };
    render();
  } else if(action === 'chess-theory-select'){
    chessTheorySelect(parseInt(el.dataset.idx,10));
  } else if(action === 'chess-theory-next'){
    chessTheoryNext();
  } else if(action === 'chess-theory-prev'){
    chessTheoryPrev();
  } else if(action === 'chess-theory-reset'){
    chessTheoryReset();
  } else if(action === 'chess-theory-back'){
    chessTheoryBack();
  } else if(action === 'go-joseki-next'){
    goJosekiNext();
  } else if(action === 'go-joseki-prev'){
    goJosekiPrev();
  } else if(action === 'go-joseki-reset'){
    goJosekiReset();
  } else if(action === 'go-joseki-select'){
    goJosekiSelect(parseInt(el.dataset.idx,10));
  } else if(action === 'go-joseki-back'){
    goJosekiBack();
  } else if(action === 'go-select'){
    initGoLesson(parseInt(el.dataset.idx,10));
    render();
  } else if(action === 'go-prev'){
    if(state.go.lessonIdx > 0) initGoLesson(state.go.lessonIdx - 1);
    render();
  } else if(action === 'go-next'){
    if(state.go.lessonIdx < GO_LESSONS.length - 1) initGoLesson(state.go.lessonIdx + 1);
    render();
  } else if(action === 'go-reset'){
    initGoLesson(state.go.lessonIdx);
    render();
  } else if(action === 'go-point'){
    placeGoStone(parseInt(el.dataset.r,10), parseInt(el.dataset.c,10));
  }
});

render();
</script>
